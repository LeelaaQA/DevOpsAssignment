# Default settings. Any value can be overridden on the command line with -Dkey=value
# Example: mvn clean test -Dbrowser=firefox -DbaseUrl=https://www.amazon.com

# chrome | firefox | edge
browser=chrome

# grid  = run on the Docker Selenium Grid (required for the assignment)
# local = run a browser installed on this PC (for quick debugging only)
execution=grid

# Selenium Grid address (Docker publishes the Hub on port 4444 of the Windows host)
gridUrl=http://localhost:4444

# Public Amazon site under test (change to https://www.amazon.com if you prefer)
baseUrl=https://www.amazon.in

searchTerm=laptop

# true = run browsers without a visible window
headless=false

# Explicit wait timeout in seconds
explicitWaitSeconds=20
