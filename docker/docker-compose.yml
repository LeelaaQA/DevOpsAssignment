# Selenium Grid 4 (Hub + 3 browser nodes) for the StarAgile DevOps assignment.
# Start : docker compose -f docker/docker-compose.yml up -d
# Check : http://localhost:4444/ui      (Grid console)
# Stop  : docker compose -f docker/docker-compose.yml down
#
# Tests connect to http://localhost:4444 . The Hub forwards each session to the
# node that matches the requested browser (chrome / firefox / MicrosoftEdge).
# If the image tag below cannot be pulled, use the shorter tag 4.48.0 instead.
name: selenium-grid

services:
  selenium-hub:
    image: selenium/hub:4.48.0-20260905
    container_name: selenium-hub
    ports:
      - "4442:4442"   # event bus (publish)
      - "4443:4443"   # event bus (subscribe)
      - "4444:4444"   # Grid endpoint + UI used by the tests
    networks:
      - grid

  chrome:
    image: selenium/node-chrome:4.48.0-20260905
    container_name: selenium-node-chrome
    shm_size: "2gb"
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=1
      - SE_VNC_NO_PASSWORD=1
    ports:
      - "7900:7900"   # watch the Chrome node live: http://localhost:7900
    networks:
      - grid

  firefox:
    image: selenium/node-firefox:4.48.0-20260905
    container_name: selenium-node-firefox
    shm_size: "2gb"
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=1
      - SE_VNC_NO_PASSWORD=1
    ports:
      - "7901:7900"   # watch the Firefox node live: http://localhost:7901
    networks:
      - grid

  edge:
    image: selenium/node-edge:4.48.0-20260905
    container_name: selenium-node-edge
    shm_size: "2gb"
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=1
      - SE_VNC_NO_PASSWORD=1
    ports:
      - "7902:7900"   # watch the Edge node live: http://localhost:7902
    networks:
      - grid

networks:
  grid:
    driver: bridge
